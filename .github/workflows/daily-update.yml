name: Daily data refresh and deploy

on:
  schedule:
    # GitHub cron is best-effort and 整點(top of hour) slots are the most congested,
    # which delayed the old '0 9' run by 4-9 hours. Use off-peak minutes, and run
    # twice (script is idempotent) so a late/missed first run or late-published
    # 三大法人 data is corrected by the second.
    - cron: '23 8 * * 1-5'    # 08:23 UTC = 16:23 Asia/Taipei, Mon-Fri
    - cron: '47 10 * * 1-5'   # 10:47 UTC = 18:47 Asia/Taipei, Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh market data
        run: python scripts/daily_update.py

      - name: Commit and push if changed
        run: |
          git config user.name "tw-stock-chip-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No data changes today (e.g. market holiday) - nothing to commit."
          else
            git add index.html
            git commit -m "auto: daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
